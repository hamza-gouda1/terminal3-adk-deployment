[package]
name = "agent-budget-guard"
version = "0.1.0"
edition = "2021"
authors = ["Hamza Gouda <hraafat357@gmail.com>"]
description = "Confidential TEE Smart Contract for Hardware-Enforced AI Agent Token & Credit Limits on Terminal3 (T3N)"

[lib]
crate-type = ["cdylib"]

[features]
# Only for hosts that provide a trusted WASI realtime clock.
wasi-clock = []

[dependencies]
wit-bindgen = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
